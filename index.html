<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Application Title -->
    <title>The Telescope</title>

    <!-- SEO Meta -->
    <meta
      name="description"
      content="The Telescope is a content sharing platform where users can create posts, interact through comments, and engage with a community."
    />
    <meta name="author" content="The Telescope" />

    <!-- Open Graph (for social sharing) -->
    <meta property="og:title" content="The Telescope" />
    <meta
      property="og:description"
      content="Share ideas, connect with others, and explore content on The Telescope."
    />
    <meta property="og:type" content="website" />
    <meta
      property="og:image"
      content="/images/telescope-og-image.png"
    />

    <!-- Twitter Card -->
   
    <meta name="twitter:site" content="@TelescopeApp" />
    <meta
      name="twitter:image"
      content="/images/telescope-og-image.png"
    />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
